# OPTIONAL: Docker Compose is for team development only.
# The desktop app (Electron) runs everything locally without Docker.
# For solo use, just run: npm run dev (Electron spawns the backend automatically)

version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devcore}
      POSTGRES_DB: ${POSTGRES_DB:-devcore}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devcore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/devcore123}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2

  backend1:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started

  backend2:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: >
      celery -A app.core.celery_app.celery_app worker
      --loglevel=info
      --concurrency=2
      -Q tailor,celery
    env_file: backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  pg_data:
  neo4j_data:
