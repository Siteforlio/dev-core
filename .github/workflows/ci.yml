name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: devcore
          POSTGRES_PASSWORD: devcore
          POSTGRES_DB: devcore_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-ci.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://devcore:devcore@localhost:5433/devcore_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          DEEPSEEK_API_KEY: test-key
          DEEPGRAM_API_KEY: test-key
          JOB_HUNTER_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/ -v --tb=short --ignore=tests/integration --ignore=tests/test_db_connections.py

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npm run type-check
